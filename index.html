
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Camera Project</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h3>사진 업로드</h3>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <button id="uploadButton">
        사진 업로드
    </button>

    <div id="imageContainer">
        <img id="uploadedImage" alt="업로드한 사진">
    </div>

    <h3>영상 촬영</h3>

    <div id="cameraControls">

        <button id="startButton">
            촬영
        </button>

        <button id="stopButton" disabled>
            중지
        </button>

    </div>

    <p id="status">촬영 대기 중</p>

    <h3>촬영한 영상 가져오기</h3>

    <input
        type="file"
        id="videoInput"
        accept="video/*"
    >

    <video
        id="recordedVideo"
        controls
        playsinline
        hidden
    ></video>

    <a id="downloadLink" hidden>
        영상 다운로드
    </a>

    <script src="script.js"></script>

</body>
</html>
